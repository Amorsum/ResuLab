name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          node -e "for (const name of ['VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY', 'VITE_AI_API_BASE', 'VITE_AGENT_API_BASE']) { if (!process.env[name]?.trim()) throw new Error('Missing deployment config: ' + name); } for (const name of ['VITE_AI_API_BASE','VITE_AGENT_API_BASE']) if (new URL(process.env[name]).protocol !== 'https:') throw new Error(name + ' must use HTTPS');"
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AI_API_BASE: ${{ secrets.VITE_AI_API_BASE || 'https://api.amorsum.top' }}
          VITE_AGENT_API_BASE: ${{ vars.VITE_AGENT_API_BASE }}
          VITE_AGENT_MOCK: 'false'

      - name: Record deployed version
        run: |
          node -e "const fs=require('node:fs'); fs.writeFileSync('dist/version.json', JSON.stringify({commit: process.env.GITHUB_SHA, builtAt: new Date().toISOString(), apiMode: 'split-services', extension: JSON.parse(fs.readFileSync('dist/downloads/extension.json','utf8')).version}))"

      - name: Copy index.html to 404.html (SPA routing fix)
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: resulab.amorsum.top
          force_orphan: true
