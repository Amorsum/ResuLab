name: Deploy contest frontend to GitHub Pages

on:
  push:
    branches: [codex/contest-b]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/codex/contest-b'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          node -e "for (const name of ['VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY', 'VITE_AGENT_API_BASE']) { if (!process.env[name]?.trim()) throw new Error('Missing deployment config: ' + name); } if (new URL(process.env.VITE_AGENT_API_BASE).protocol !== 'https:') throw new Error('Agent API must use HTTPS');"
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AI_API_BASE: ${{ secrets.VITE_AI_API_BASE }}
          VITE_AGENT_API_BASE: ${{ vars.VITE_AGENT_API_BASE }}
          VITE_AGENT_MOCK: 'false'

      - name: Record deployed version
        run: |
          node -e "require('node:fs').writeFileSync('dist/version.json', JSON.stringify({commit: process.env.GITHUB_SHA, builtAt: new Date().toISOString()}))"

      - name: Copy index.html to 404.html (SPA routing fix)
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: resulab.amorsum.top
          force_orphan: true
