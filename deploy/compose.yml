services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8788
    restart: unless-stopped
    init: true
    mem_limit: 384m
    cpus: 1.0
    expose: ["8788"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_AI_API_BASE: ${VITE_AI_API_BASE:-https://api.amorsum.top}
        VITE_AGENT_API_BASE: ${VITE_AGENT_API_BASE:-}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    expose: ["8080"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  gateway:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_started }
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  caddy_data:
  caddy_config:
